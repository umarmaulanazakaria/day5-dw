<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <script src="dist/siswa.js" defer></script>
    <link rel="stylesheet" href="siswa.css" />
    <title>Data Siswa</title>
  </head>
  <body>
    <nav class="pencariansiswa">
      <a class="active" href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>

      <div class="search-container">
        <form id="searchForm">
          <input
            type="text"
            id="searchInput"
            placeholder="Cari nama siswa..."
            autocomplete="off"
          />
          <button type="submit">
            <i class="fa-solid fa-magnifying-glass"></i>
            Cari
          </button>
        </form>
      </div>
    </nav>

    <main class="container-siswa" id="home">
      <section class="judul-halaman">
        <p class="label-kecil">DAFTAR NILAI</p>
        <h1>Data Siswa</h1>
      </section>

      <section class="kartu-tabel">
        <div class="informasi-tabel">
          <h2>Daftar Siswa</h2>
          <p id="hasilsiswa">0 siswa ditampilkan</p>
        </div>

        <div class="table-responsive">
          <table class="tabel-siswa">
            <thead>
              <tr>
                <th>No.</th>
                <th>Nama</th>
                <th>Kelas</th>
                <th>Nilai</th>
              </tr>
            </thead>
            <tbody id="tabelsiswa"></tbody>
          </table>
        </div>

        <div class="ringkasan-nilai">
          <span>Rata-rata Nilai</span>
          <strong id="rataratanilai">0,00</strong>
        </div>
      </section>
    </main>
  </body>
</html>
